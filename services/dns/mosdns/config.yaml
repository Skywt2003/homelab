log:
  level: info
  production: true

# The API is intentionally loopback-only. It exposes Prometheus metrics used by
# the health check and by the DNS comparison report.
api:
  http: 127.0.0.1:9092

plugins:
  # Generated by update-rules.py. Bare domains use mosdns' domain matcher and
  # therefore include the domain itself and all subdomains.
  - tag: domain_cn
    type: domain_set
    args:
      files:
        - /etc/mosdns/rules/cn_domain.list

  - tag: domain_apple
    type: domain_set
    args:
      files:
        - /etc/mosdns/rules/apple_domain.list
      exps:
        # Broad parent domains from the Apple geosite family. The generated
        # file below adds Apple-China CDN hostnames and exact aliases.
        - domain:apple
        - domain:apple.com
        - domain:icloud.com
        - domain:icloud-content.com
        - domain:me.com
        - domain:mac.com
        - domain:mzstatic.com
        - domain:aaplimg.com
        - domain:cdn-apple.com
        - domain:apple-dns.net
        - domain:apple-cloudkit.com
        - domain:apple-mapkit.com
        - domain:itunes.com
        - domain:appstore.com
        - domain:shazam.com
        - domain:beats.com

  - tag: domain_proxy
    type: domain_set
    args:
      files:
        - /etc/mosdns/rules/proxy_domain.list
      exps:
        # Keep these critical services on clean global DNS even if an external
        # list update is delayed.
        - domain:openai.com
        - domain:chatgpt.com
        - domain:oaistatic.com
        - domain:oaiusercontent.com

  - tag: ip_cn
    type: ip_set
    args:
      files:
        - /etc/mosdns/rules/cn_ip.list

  # Layer 1: local records and AdGuard-compatible wildcard rewrites.
  - tag: local_hosts
    type: hosts
    args:
      entries:
        - "domain:lab.skywt 100.64.0.2"
        - "domain:dev.skywt 100.64.0.5"
        - "domain:mac-mini.skywt 100.64.0.17"
        - "full:nas.skywt 100.64.0.12"
        - "full:pve.skywt 100.64.0.4"
        - "full:gz.skywt 101.33.238.184"
        - "full:la.skywt 45.32.88.139"
        - "full:sv.skywt 149.28.207.61"

  - tag: local_records
    type: arbitrary
    args:
      rules:
        - "skywt.internal. 300 IN MX 10 mail.lab.skywt."

  - tag: cache
    type: cache
    args:
      size: 16384
      lazy_cache_ttl: 0
      dump_file: /var/cache/mosdns/cache.dump
      dump_interval: 600

  # Domestic branch: AliDNS and DNSPod over DoH. dial_addr pins the encrypted
  # endpoint IP and avoids a plaintext bootstrap lookup.
  - tag: forward_cn
    type: forward
    args:
      concurrent: 2
      upstreams:
        - tag: alidns_doh
          addr: https://dns.alidns.com/dns-query
          dial_addr: 223.5.5.5
        - tag: dnspod_doh
          addr: https://doh.pub/dns-query
          dial_addr: 1.12.12.12

  # Global branch: two independent DoH resolvers through Mihomo's dedicated
  # SOCKS5 listener. Direct global 443/853 is reset on the current ISP path;
  # using the proxy is required to avoid accepting demonstrably polluted
  # domestic answers for global domains. Endpoint IPs are pinned so startup
  # never recursively depends on DNS.
  - tag: forward_global
    type: forward
    args:
      concurrent: 2
      socks5: 100.64.0.7:10811
      upstreams:
        - tag: cloudflare_doh
          addr: https://cloudflare-dns.com/dns-query
          dial_addr: 1.1.1.1
        - tag: google_doh
          addr: https://dns.google/dns-query
          dial_addr: 8.8.8.8

  - tag: query_cn_checked
    type: sequence
    args:
      - exec: $forward_cn
      - matches:
          - "! rcode 0"
        exec: drop_resp

  - tag: query_global
    type: sequence
    args:
      - exec: $forward_global

  # Known direct domains prefer domestic DNS. Global DNS is used only when the
  # domestic encrypted upstreams fail or return a non-NOERROR response.
  - tag: domestic_resilient
    type: fallback
    args:
      primary: query_cn_checked
      secondary: query_global
      threshold: 800
      always_standby: false

  # Unknown domains use true domestic/global dual lookup. A domestic A/AAAA
  # answer is valid only when at least one returned address is in the CN set;
  # otherwise it is dropped and the already-running global answer is selected.
  - tag: query_unknown_cn_validated
    type: sequence
    args:
      - exec: $forward_cn
      - matches:
          - "! rcode 0"
        exec: drop_resp
      - matches:
          - has_resp
          - qtype 1 28
          - "! resp_ip $ip_cn"
        exec: drop_resp

  - tag: unknown_dual
    type: fallback
    args:
      primary: query_unknown_cn_validated
      secondary: query_global
      threshold: 300
      always_standby: true

  # Per-route metrics make it possible to prove which policy layer handled a
  # test without enabling unbounded per-query logging.
  - tag: route_apple
    type: sequence
    args:
      - exec: metrics_collector route_apple
      - exec: $domestic_resilient

  - tag: route_proxy
    type: sequence
    args:
      - exec: metrics_collector route_proxy
      - exec: $forward_global

  - tag: route_cn
    type: sequence
    args:
      - exec: metrics_collector route_cn
      - exec: $domestic_resilient

  - tag: route_unknown
    type: sequence
    args:
      - exec: metrics_collector route_unknown
      - exec: $unknown_dual

  # Four-layer policy. Apple is evaluated before the proxy list so the user's
  # explicit Apple-direct policy always wins. Proxy rules precede the general
  # CN set to make any accidental list overlap fail closed to clean DNS.
  - tag: main
    type: sequence
    args:
      - exec: $local_hosts
      - matches:
          - has_resp
        exec: accept
      - exec: $local_records
      - matches:
          - has_resp
        exec: accept
      - exec: $cache
      - matches:
          - has_resp
        exec: accept
      - matches:
          - qname $domain_apple
        exec: goto route_apple
      - matches:
          - qname $domain_proxy
        exec: goto route_proxy
      - matches:
          - qname $domain_cn
        exec: goto route_cn
      - exec: goto route_unknown

  - tag: udp_server
    type: udp_server
    args:
      entry: main
      listen: 100.64.0.2:53

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main
      listen: 100.64.0.2:53
