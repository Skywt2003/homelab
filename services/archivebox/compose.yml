services:
  archivebox:
    image: archivebox/archivebox:latest
    container_name: lab-archivebox
    restart: unless-stopped
    environment:
      BASE_URL: https://archive.lab.skywt
      SERVER_SECURITY_MODE: safe-onedomain-nojsreplay
      PUBLIC_ADD_VIEW: "False"
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/archivebox/data:/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "Host: archive.lab.skywt", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      caddy: archive.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8000}}"
      labdash.enable: "true"
      labdash.name: archive
      labdash.appname: ArchiveBox
      labdash.url: https://archive.lab.skywt
      labdash.icon: archive
      labdash.group: Personal
      labdash.order: "10"

networks:
  lab-proxy:
    external: true
