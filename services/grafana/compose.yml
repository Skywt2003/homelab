services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: lab-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: grafana.lab.skywt
      GF_SERVER_ROOT_URL: https://grafana.lab.skywt/
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mail.lab.skywt:2525
      GF_SMTP_FROM_ADDRESS: grafana@skywt.internal
      GF_SMTP_FROM_NAME: Grafana
      GF_SMTP_EHLO_IDENTITY: grafana.lab.skywt
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/grafana/data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      caddy: grafana.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 3000}}"
      labdash.enable: "true"
      labdash.name: grafana
      labdash.appname: Grafana
      labdash.url: https://grafana.lab.skywt
      labdash.icon: chart-line
      labdash.group: Observability
      labdash.order: "20"

networks:
  lab-proxy:
    external: true
