services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    container_name: lab-caddy
    restart: unless-stopped
    command: docker-proxy --caddyfile-path /etc/caddy/acme-server.Caddyfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: lab-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme-server.Caddyfile:/etc/caddy/acme-server.Caddyfile:ro
      - /data/homelab/lab/caddy/data:/data
      - /data/homelab/lab/caddy/config:/config
    labels:
      labdash.enable: "true"
      labdash.name: acme
      labdash.appname: Caddy ACME
      labdash.url: https://acme.lab.skywt/health
      labdash.icon: route
      labdash.group: Infrastructure
      labdash.order: "10"

networks:
  lab-proxy:
    name: lab-proxy
