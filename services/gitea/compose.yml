services:
  gitea:
    image: docker.gitea.com/gitea:latest
    container_name: lab-gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__DOMAIN: git.lab.skywt
      GITEA__server__ROOT_URL: https://git.lab.skywt/
      GITEA__server__SSH_DOMAIN: git.lab.skywt
      GITEA__server__SSH_PORT: 2222
    ports:
      - "2222:22"
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      caddy: git.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 3000}}"
      labdash.enable: "true"
      labdash.name: git
      labdash.appname: Gitea
      labdash.url: https://git.lab.skywt
      labdash.icon: brand-git
      labdash.group: Development
      labdash.order: "10"

networks:
  lab-proxy:
    external: true
