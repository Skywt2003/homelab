services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: lab-calibre-web
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/calibre-web/config:/config
      - /data/homelab/lab/calibre-web/books:/books
    labels:
      caddy: books.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8083}}"
      labdash.enable: "true"
      labdash.name: books
      labdash.appname: Calibre-Web
      labdash.url: https://books.lab.skywt
      labdash.icon: book
      labdash.group: Personal
      labdash.order: "20"

networks:
  lab-proxy:
    external: true
