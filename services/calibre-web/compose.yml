services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: lab-calibre-web
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/calibre-web/config:/config
      - type: volume
        source: calibre-books
        target: /books
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8083/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      caddy: books.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8083}}"
      labdash.enable: "true"
      labdash.name: books
      labdash.appname: Calibre-Web
      labdash.url: https://books.lab.skywt
      labdash.icon: book
      labdash.group: Personal
      labdash.order: "20"

networks:
  lab-proxy:
    external: true

volumes:
  calibre-books:
    name: lab-calibre-web-books
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.21,rw,nfsvers=4.2,proto=tcp,hard,resvport
      device: ":/Books"
