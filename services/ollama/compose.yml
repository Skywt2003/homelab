services:
  ollama:
    image: ollama/ollama:latest
    container_name: lab-ollama
    restart: unless-stopped
    cpus: "3.0"
    mem_limit: 5.5g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      HTTP_PROXY: http://proxy:10810
      HTTPS_PROXY: http://proxy:10810
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,::1,lab-ollama,ollama,lab-open-webui,open-webui,lab-caddy,.lab.skywt,lab-proxy
      http_proxy: http://proxy:10810
      https_proxy: http://proxy:10810
      no_proxy: localhost,127.0.0.1,0.0.0.0,::1,lab-ollama,ollama,lab-open-webui,open-webui,lab-caddy,.lab.skywt,lab-proxy
    extra_hosts:
      - "proxy:100.64.0.7"
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      caddy: llm.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 11434}}"
      labdash.enable: "true"
      labdash.name: llm
      labdash.appname: Ollama
      labdash.url: https://llm.lab.skywt
      labdash.icon: ai
      labdash.group: Services
      labdash.order: "40"

networks:
  lab-proxy:
    external: true
