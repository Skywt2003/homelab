services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: lab-open-webui
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WEBUI_URL: https://ai.lab.skywt
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      OLLAMA_BASE_URL: http://lab-ollama:11434
      DEFAULT_USER_ROLE: pending
      CORS_ALLOW_ORIGIN: https://ai.lab.skywt
      # Open WebUI downloads its default embedding model on first start and
      # needs the lab proxy for Hugging Face and other outbound HTTPS traffic.
      HTTP_PROXY: http://proxy:10810
      HTTPS_PROXY: http://proxy:10810
      ALL_PROXY: http://proxy:10810
      http_proxy: http://proxy:10810
      https_proxy: http://proxy:10810
      all_proxy: http://proxy:10810
      NO_PROXY: localhost,127.0.0.1,::1,lab-open-webui,open-webui,lab-ollama,ollama,lab-new-api,new-api,lab-caddy,.lab.skywt,lab-proxy
      no_proxy: localhost,127.0.0.1,::1,lab-open-webui,open-webui,lab-ollama,ollama,lab-new-api,new-api,lab-caddy,.lab.skywt,lab-proxy
    extra_hosts:
      - "proxy:100.64.0.7"
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/open-webui:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      caddy: ai.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8080}}"
      labdash.enable: "true"
      labdash.name: ai
      labdash.appname: Open WebUI
      labdash.url: https://ai.lab.skywt
      labdash.icon: message-chatbot
      labdash.group: Services
      labdash.order: "20"

networks:
  lab-proxy:
    external: true
