services:
  apprise-api:
    image: caronc/apprise:latest
    container_name: lab-apprise-api
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"
      TZ: Etc/UTC
    networks:
      - lab-proxy
    volumes:
      - /data/homelab/lab/apprise-api/config:/config
      - /data/homelab/lab/apprise-api/attach:/attach
      - /data/homelab/lab/apprise-api/plugin:/plugin
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      caddy: notify.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8000}}"
      labdash.enable: "true"
      labdash.name: notify
      labdash.appname: Apprise API
      labdash.url: https://notify.lab.skywt
      labdash.icon: bell
      labdash.group: Services
      labdash.order: "10"

networks:
  lab-proxy:
    external: true
