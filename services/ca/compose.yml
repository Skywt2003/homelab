services:
  ca:
    image: caddy:2-alpine
    container_name: lab-ca
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - lab-proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/site:ro
      - /data/homelab/lab/caddy/data:/srv/caddy-data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      caddy: ca.lab.skywt
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 8080}}"
      labdash.enable: "true"
      labdash.name: ca
      labdash.appname: Lab CA
      labdash.url: https://ca.lab.skywt
      labdash.icon: certificate
      labdash.group: Infrastructure
      labdash.order: "20"

networks:
  lab-proxy:
    external: true
