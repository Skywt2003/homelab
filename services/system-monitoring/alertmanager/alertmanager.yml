global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - job
  routes:
    - receiver: apprise-bark
      matchers:
        - alertname="MihomoNodeGroupAvailabilityTooLow"
      group_by:
        - alertname
        - node_group
      group_wait: 30s
      group_interval: 5m
      # Avoid repeated notifications during one incident. A weekly reminder is
      # retained for a pathological long-running outage.
      repeat_interval: 168h
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
  - name: apprise-bark
    webhook_configs:
      - send_resolved: true
        # The title becomes "firing" or "resolved"; the body keeps group details.
        url: 'http://lab-apprise-api:8000/notify/apprise?:status=title&:commonAnnotations.description=body&:type=warning&:format=text'
