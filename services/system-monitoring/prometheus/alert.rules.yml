groups:
  - name: service-health
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for more than 1 minute."

  - name: host-health
    rules:
      - alert: HostHighLoad
        expr: node_load1 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High load on {{ $labels.instance }}"
          description: "1-minute load average has exceeded 1.5x CPU core count for more than 5 minutes."

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/docker/.+"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/var/lib/docker/.+"}) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} has less than 10% free space for more than 10 minutes."

      - alert: HostHighMemoryUsage
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has exceeded 90% for more than 10 minutes."

  - name: mihomo-recording
    rules:
      - record: mihomo_proxy_probe_failure_ratio_5m
        expr: 1 - avg_over_time(mihomo_proxy_available{node_group=~"airport|self_hosted"}[5m])

      - record: mihomo_proxy_latency_jitter_ms_5m
        expr: stddev_over_time(clamp_min(mihomo_proxy_latency_ms{node_group=~"airport|self_hosted"}, 0)[5m:])

      - record: mihomo_selected_proxy_latency_ms
        expr: mihomo_proxy_latency_ms * on(proxy_name) group_left(group, proxy, type) label_replace(mihomo_proxy_group_selected{group="PROXY"}, "proxy_name", "$1", "proxy", "(.*)")

      - record: mihomo_selected_proxy_available
        expr: mihomo_proxy_available * on(proxy_name) group_left(group, proxy, type) label_replace(mihomo_proxy_group_selected{group="PROXY"}, "proxy_name", "$1", "proxy", "(.*)")

      - record: mihomo_node_group_available_nodes
        expr: sum by (node_group) (mihomo_proxy_available{job="mihomo-exporter",node_group=~"airport|self_hosted"})

      - record: mihomo_node_group_total_nodes
        expr: count by (node_group) (mihomo_proxy_available{job="mihomo-exporter",node_group=~"airport|self_hosted"})

      - record: mihomo_node_group_available_ratio
        expr: mihomo_node_group_available_nodes / mihomo_node_group_total_nodes

  - name: mihomo-health
    rules:
      - alert: MihomoExporterDown
        expr: up{job="mihomo-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Mihomo exporter is down"
          description: "Prometheus cannot scrape lab-mihomo-exporter for more than 2 minutes."

      - alert: MihomoSelectedProxyUnavailable
        expr: mihomo_selected_proxy_available == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Selected Mihomo proxy is unavailable"
          description: "Proxy group {{ $labels.group }} selected {{ $labels.proxy_name }}, but probe availability is 0."

      - alert: MihomoSelectedProxyHighLatency
        expr: mihomo_selected_proxy_latency_ms > 1500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Selected Mihomo proxy has high latency"
          description: "Proxy group {{ $labels.group }} selected {{ $labels.proxy_name }} with latency {{ $value }} ms for more than 5 minutes."

      - alert: MihomoProxyHighProbeFailureRatio
        expr: mihomo_proxy_probe_failure_ratio_5m > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mihomo proxy has high probe failure ratio"
          description: "Proxy {{ $labels.proxy_name }} has probe failure ratio {{ $value }} over 5 minutes."

      - alert: MihomoNodeGroupAvailabilityTooLow
        expr: mihomo_node_group_available_ratio < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mihomo node group {{ $labels.node_group }} availability is low"
          description: "Node group {{ $labels.node_group }} availability is {{ $value | humanizePercentage }} (threshold: 20%) for more than 10 minutes."

  - name: website-uptime
    rules:
      - alert: WebsiteDown
        expr: probe_success{job="website-uptime"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Website is down: {{ $labels.instance }}"
          description: "{{ $labels.instance }} has failed blackbox probing for more than 2 minutes."

      - alert: WebsiteSlow
        expr: probe_duration_seconds{job="website-uptime"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Website is slow: {{ $labels.instance }}"
          description: "{{ $labels.instance }} response time is above 3 seconds for more than 5 minutes."

      - alert: WebsiteCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="website-uptime"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon: {{ $labels.instance }}"
          description: "{{ $labels.instance }} certificate expires in less than 14 days."
