global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lab-system-monitoring

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: lab

  - job_name: pve-node-exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - 100.64.0.4:9100
        labels:
          host: pve

  - job_name: pve
    scrape_interval: 15s
    metrics_path: /pve
    params:
      module:
        - default
      cluster:
        - "1"
      node:
        - "1"
    static_configs:
      - targets:
          - 100.64.0.4
        labels:
          host: pve
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          host: lab

  - job_name: mihomo-exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - mihomo-exporter:9188
        labels:
          host: proxy
          app: mihomo

  - job_name: website-uptime
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://skywt.cn
          - https://skywt.net
        labels:
          category: website
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: pushgateway
    scrape_interval: 10s
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093
