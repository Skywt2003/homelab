global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lab-system-monitoring

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: lab

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          host: lab

  - job_name: mihomo-exporter
    scrape_interval: 5s
    static_configs:
      - targets:
          - mihomo-exporter:9188
        labels:
          host: proxy
          app: mihomo

  - job_name: pushgateway
    scrape_interval: 10s
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093
